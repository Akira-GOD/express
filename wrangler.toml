name = "return-register-system"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# Pages Functions 路由配置
[functions]
# 所有 /api/* 请求由 functions 目录处理

# KV 命名空间绑定
# ⚠️ Cloudflare Pages 的 KV 绑定需在 Dashboard 中配置，不能写在 wrangler.toml 中
# 部署后请在 Cloudflare Dashboard 中：
#   Workers & Pages → return-register-system → Settings → Functions → KV namespace bindings
#   添加绑定：变量名 RETURN_REGISTER，选择对应的 KV 命名空间
#
# 已创建的 KV 命名空间 ID：
#   生产环境：2b34b9c746094228975a4bc6be378c5d
#   预览环境：请运行 npx wrangler kv:namespace create "RETURN_REGISTER" --preview 获取
#
# 如果您使用的是 Cloudflare Workers（非 Pages），请删除 pages_build_output_dir，
# 并取消下面注释来配置 KV：
# [[kv_namespaces]]
# binding = "RETURN_REGISTER"
# id = "2b34b9c746094228975a4bc6be378c5d"
# preview_id = "YOUR_KV_PREVIEW_ID"